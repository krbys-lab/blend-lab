<!doctype html><html lang="ja"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Blend Lab</title><style>*{box-sizing:border-box}body{margin:0;background:#17191f;color:#eee;font:14px system-ui,sans-serif}header,main{max-width:1200px;margin:auto;padding:20px}h1{margin:0;letter-spacing:2px}small,p{color:#a9aab8}button,input,select{font:inherit;color:inherit;background:#30333e;border:1px solid #454957;border-radius:7px;padding:8px}button{cursor:pointer}button:hover,button.active{background:#595478}input[type=color]{width:48px;height:40px;padding:3px}input[type=range]{width:100%;accent-color:#b9aaff}input[type=text]{width:100px}nav,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}nav{margin-top:20px}section,.panel{background:#22252e;border-radius:12px;padding:16px;margin-bottom:16px}label{display:block;color:#bfc0cc;margin-bottom:6px}.controls{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}.tile{background:#292c35;padding:10px;border-radius:9px}canvas{width:100%;display:block;border-radius:6px;object-fit:contain}.tile .row{justify-content:space-between;margin-top:8px}.layer{border-top:1px solid #444;padding:12px 0}.hidden{display:none}a{color:#c5baff}h2{font-size:18px;margin-top:0} @media(max-width:500px){header,main{padding:12px}.cards{grid-template-columns:repeat(2,minmax(0,1fr))}.tile{padding:6px}button{padding:7px} }</style><header><h1>Blend Lab</h1><small>Color & Light Laboratory for Artists · v0.2</small><nav id="nav"></nav><p id="boot">JavaScriptが起動していません。HTMLのプレビューではなく、Webサイトとしてブラウザで開いてください。</p></header><main><section><div class="controls"><div><label>背景色</label><div class="row"><input type="color" id="base" value="#263957"><input type="text" id="baseHex" value="#263957"></div></div><div><label>描画色</label><div class="row"><input type="color" id="ink" value="#65d8ff"><input type="text" id="inkHex" value="#65d8ff"></div></div><div><label>不透明度 <span id="opLabel">70%</span></label><input id="op" type="range" min="0" max="100" value="70"></div><div><label>背景画像（端末内処理）</label><input id="upload" type="file" accept="image/*" style="max-width:100%"><button id="clear">画像解除</button></div></div></section><div id="blend"><section><div class="row"><label>プレビュー</label><select id="shape"><option value="glow">光彩</option><option value="flat">ベタ塗り</option><option value="gradient">グラデーション</option><option value="trail">光の軌跡</option></select><button id="all">全モード表示</button></div><details><summary>使用可能モードの設定</summary><div id="filters" class="row"></div></details></section><div class="cards" id="cards"></div></div><div id="color" class="hidden"><section><h2>色彩・中間色</h2><div class="row"><select id="space"><option>RGB</option><option>HSV</option></select><label>描画色の数値入力</label><input id="channels" type="text" style="width:160px"><button id="applyChannels">適用</button></div><label>背景色から描画色への中間色</label><div id="palette" class="cards"></div></section></div><div id="light" class="hidden"><section><h2>レイヤー実験</h2><canvas id="stackCanvas" width="320" height="200" style="max-width:680px;margin:auto"></canvas><p>上のレイヤーほど手前に合成されます。画像をタップすると結果色を描画色に取得します。</p><div class="row"><button id="add">＋ レイヤー</button><button id="example">発光プリセット</button><button id="savePNG">PNG出力</button></div><div id="layers"></div></section></div><div id="library" class="hidden"><section><h2>プリセット</h2><div class="row"><input id="presetName" placeholder="名前" style="width:180px"><button id="savePreset">保存</button><button id="export">JSON書き出し</button><label>JSON読み込み <input type="file" id="import" accept=".json,application/json"></label></div><div id="presets"></div><p>保存先は現在のブラウザです。別端末へはJSONで移行できます。背景画像は保存しません。</p></section></div><p>一般的なRGB合成式による近似です。クリスタ・Photoshopの発光固有処理、色管理、PSD互換性を保証しません。</p><div id="status" role="status"></div></main><script>
window.onerror=function(m){document.getElementById("boot").textContent="動作エラー: "+m;};

const $=id=>document.getElementById(id), clamp=x=>Math.max(0,Math.min(1,x)), rgb=h=>h.match(/[\da-f]{2}/gi).map(x=>parseInt(x,16)/255), hex=a=>'#'+a.map(x=>Math.round(clamp(x)*255).toString(16).padStart(2,'0')).join('');const dodge=(b,s)=>s>=1?1:b/(1-s),burn=(b,s)=>s<=0?0:1-(1-b)/s;const modes={'通常':(b,s)=>s,'乗算':(b,s)=>b*s,'スクリーン':(b,s)=>1-(1-b)*(1-s),'加算':(b,s)=>b+s,'覆い焼きカラー':dodge,'焼き込みカラー':burn,'オーバーレイ':(b,s)=>b<.5?2*b*s:1-2*(1-b)*(1-s),'ハードライト':(b,s)=>s<.5?2*b*s:1-2*(1-b)*(1-s),'ソフトライト':(b,s)=>s<.5?b-(1-2*s)*b*(1-b):b+(2*s-1)*((b<=.25?((16*b-12)*b+4)*b:Math.sqrt(b))-b),'リニアライト':(b,s)=>b+2*s-1,'ビビッドライト':(b,s)=>s<.5?burn(b,2*s):dodge(b,2*s-1),'比較（明）':Math.max,'比較（暗）':Math.min,'差の絶対値':(b,s)=>Math.abs(b-s),'除外':(b,s)=>b+s-2*b*s,'焼き込み（リニア）':(b,s)=>b+s-1};let allowed=Object.keys(modes), image=null, layers=[],tab='blend';const W=320,H=200;function background(){let c=document.createElement('canvas');c.width=W;c.height=H;let x=c.getContext('2d');x.fillStyle=$('base').value;x.fillRect(0,0,W,H);if(image){let s=Math.min(W/image.width,H/image.height);x.drawImage(image,(W-image.width*s)/2,(H-image.height*s)/2,image.width*s,image.height*s)}return x.getImageData(0,0,W,H)}function mask(shape,size=70){let c=document.createElement('canvas');c.width=W;c.height=H;let x=c.getContext('2d');let r=Math.max(1,size/100*W*.55);if(shape==='flat'){x.fillRect(W*.2,H*.2,W*.6,H*.6)}else if(shape==='gradient'){let g=x.createLinearGradient(0,0,W,0);g.addColorStop(0,'transparent');g.addColorStop(1,'black');x.fillStyle=g;x.fillRect(0,0,W,H)}else if(shape==='trail'){x.strokeStyle='black';x.lineWidth=Math.max(2,size/5);x.lineCap='round';x.shadowColor='black';x.shadowBlur=size/2;x.beginPath();x.moveTo(W*.104,H*.7);x.quadraticCurveTo(W*.458,H*.067,W*.896,H*.367);x.stroke()}else if(shape==='core'){x.lineWidth=Math.max(1,size/10);x.strokeStyle='black';x.beginPath();x.moveTo(W*.104,H*.7);x.quadraticCurveTo(W*.458,H*.067,W*.896,H*.367);x.stroke()}else{let g=x.createRadialGradient(W/2,H/2,0,W/2,H/2,r);g.addColorStop(0,'black');g.addColorStop(.25,'rgba(0,0,0,.85)');g.addColorStop(1,'transparent');x.fillStyle=g;x.fillRect(0,0,W,H)}return x.getImageData(0,0,W,H).data}function apply(data,l,m){let s=rgb(l.color),f=modes[l.mode]||modes['通常'],a=l.op/100;for(let i=0;i<data.length;i+=4){let t=a*m[i+3]/255;if(!t)continue;for(let j=0;j<3;j++){let b=data[i+j]/255;data[i+j]=255*(b+(clamp(f(b,s[j]))-b)*t)}}}function draw(c,ls){let d=background();for(let l of ls)if(l.visible!==false)apply(d.data,l,mask(l.shape,l.size));c.getContext('2d').putImageData(d,0,0)}function copy(t){if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>status('コピーしました '+t)).catch(()=>prompt('カラーコード',t));else prompt('カラーコード',t)}function status(t){$('status').textContent=t}function sample(c,e){let r=c.getBoundingClientRect(),x=Math.min(W-1,Math.max(0,Math.floor((e.clientX-r.left)/r.width*W))),y=Math.min(H-1,Math.max(0,Math.floor((e.clientY-r.top)/r.height*H)));let d=c.getContext('2d').getImageData(x,y,1,1).data;let h=hex([...d].slice(0,3).map(v=>v/255));$('ink').value=h;$('inkHex').value=h;copy(h);render()}function render(){ $('opLabel').textContent=$('op').value+'%';if(tab==='blend'){let root=$('cards');root.replaceChildren();let b=rgb($('base').value),s=rgb($('ink').value),a=$('op').value/100;for(let mode of allowed){let tile=document.createElement('div');tile.className='tile';let c=document.createElement('canvas');c.width=W;c.height=H;draw(c,[{color:$('ink').value,mode,op:+$('op').value,shape:$('shape').value,size:75}]);c.onclick=e=>sample(c,e);let h=hex(b.map((v,i)=>v+(clamp(modes[mode](v,s[i]))-v)*a));let row=document.createElement('div');row.className='row';let name=document.createElement('span');name.textContent=mode;let btn=document.createElement('button');btn.textContent=h;btn.onclick=()=>copy(h);row.append(name,btn);tile.append(c,row);root.append(tile)}}if(tab==='light')draw($('stackCanvas'),[...layers].reverse());if(tab==='color'){let p=$('palette');p.replaceChildren();let b=rgb($('base').value),s=rgb($('ink').value);for(let i=0;i<9;i++){let h=hex(b.map((v,j)=>v+(s[j]-v)*i/8));let el=document.createElement('button');el.style.background=h;el.style.color=rgb(h).reduce((a,b)=>a+b,0)>1.6?'#111':'#fff';el.style.height='65px';el.textContent=h;el.onclick=()=>copy(h);p.append(el)}let v=rgb($('ink').value);$('channels').value=($('space').value==='RGB'?v.map(x=>Math.round(x*255)):toHSV(v)).join(', ')}}function toHSV([r,g,b]){let m=Math.max(r,g,b),d=m-Math.min(r,g,b),h=!d?0:m===r?((g-b)/d+6)%6:m===g?(b-r)/d+2:(r-g)/d+4;return [Math.round(h*60),Math.round(m?d/m*100:0),Math.round(m*100)]}function fromHSV(h,s,v){h=((h%360)+360)%360;s=clamp(s/100);v=clamp(v/100);return [5,3,1].map(n=>{let k=(n+h/60)%6;return v-v*s*Math.max(0,Math.min(k,4-k,1))})}function filters(){ $('filters').replaceChildren();for(let m of Object.keys(modes)){let l=document.createElement('label'),c=document.createElement('input');c.type='checkbox';c.checked=allowed.includes(m);c.onchange=()=>{allowed=c.checked?Object.keys(modes).filter(x=>x===m||allowed.includes(x)):allowed.filter(x=>x!==m);render()};l.append(c,m);$('filters').append(l)}}function layerUI(){let root=$('layers');root.replaceChildren();layers.forEach((l,i)=>{let div=document.createElement('div');div.className='layer';div.innerHTML=`<div class="row"><input type="checkbox" ${l.visible!==false?'checked':''} aria-label="表示"><input type="color" value="${l.color}"><select>${Object.keys(modes).map(m=>`<option ${m===l.mode?'selected':''}>${m}</option>`).join('')}</select><select>${Object.entries({glow:'グロー',flat:'ベタ',gradient:'グラデーション',trail:'軌跡',core:'芯'}).map(([k,v])=>`<option value="${k}" ${k===l.shape?'selected':''}>${v}</option>`).join('')}</select><button>↑</button><button>↓</button><button>複製</button><button>削除</button></div><label>不透明度 <span>${l.op}%</span></label><input type="range" min="0" max="100" value="${l.op}"><label>範囲・太さ <span>${l.size}</span></label><input type="range" min="1" max="100" value="${l.size}">`;let [vis,col,mode,shape,up,down,dup,del,op,size]=div.querySelectorAll('input,select,button');vis.onchange=()=>{l.visible=vis.checked;render()};col.oninput=()=>{l.color=col.value;render()};mode.onchange=()=>{l.mode=mode.value;render()};shape.onchange=()=>{l.shape=shape.value;render()};up.onclick=()=>move(i,-1);down.onclick=()=>move(i,1);dup.onclick=()=>{layers.splice(i,0,{...l});layerUI();render()};del.onclick=()=>{layers.splice(i,1);layerUI();render()};op.oninput=()=>{l.op=+op.value;div.querySelectorAll('span')[0].textContent=l.op+'%';render()};size.oninput=()=>{l.size=+size.value;div.querySelectorAll('span')[1].textContent=l.size;render()};root.append(div)})}function move(i,d){if(i+d<0||i+d>=layers.length)return;[layers[i],layers[i+d]]=[layers[i+d],layers[i]];layerUI();render()}function example(){layers=[{color:'#efffff',mode:'通常',op:100,shape:'core',size:35},{color:'#65d8ff',mode:'スクリーン',op:85,shape:'trail',size:55},{color:'#245bff',mode:'スクリーン',op:65,shape:'glow',size:90}];layerUI();render()}function state(){return {base:$('base').value,ink:$('ink').value,op:+$('op').value,shape:$('shape').value,allowed:[...allowed],layers:layers.map(l=>({...l}))}}function restore(s){if(!s||!/^#[0-9a-f]{6}$/i.test(s.base)||!/^#[0-9a-f]{6}$/i.test(s.ink)||!Array.isArray(s.layers)||!Array.isArray(s.allowed))throw Error('形式が不正です');for(let k of ['base','ink']){$(k).value=s[k];$(k+'Hex').value=s[k]}$('op').value=s.op;$('shape').value=s.shape;allowed=s.allowed.filter(m=>Object.prototype.hasOwnProperty.call(modes,m));layers=s.layers.filter(l=>/^#[0-9a-f]{6}$/i.test(l.color)&&Object.prototype.hasOwnProperty.call(modes,l.mode)).map(l=>({color:l.color,mode:l.mode,shape:['glow','flat','gradient','trail','core'].includes(l.shape)?l.shape:'glow',op:Math.max(0,Math.min(100,+l.op||0)),size:Math.max(1,Math.min(100,+l.size||1)),visible:l.visible!==false}));filters();layerUI();render()}function download(url,name){let a=document.createElement('a');a.href=url;a.download=name;a.click()}let presets=[];try{presets=JSON.parse(localStorage.getItem('blendLabPresets')||'[]')}catch{}function presetUI(){let root=$('presets');root.replaceChildren();presets.forEach((p,i)=>{let r=document.createElement('div');r.className='row layer';let n=document.createElement('span');n.textContent=p.name;let b=document.createElement('button');b.textContent='読み込み';b.onclick=()=>{restore(p.state);status('読み込みました')};let d=document.createElement('button');d.textContent='削除';d.onclick=()=>{presets.splice(i,1);persist()};r.append(n,b,d);root.append(r)})}function persist(){try{localStorage.setItem('blendLabPresets',JSON.stringify(presets));status('保存しました')}catch{status('ブラウザ保存不可：JSONで書き出してください')}presetUI()}for(let [id,name] of Object.entries({blend:'合成比較',color:'色彩',light:'光彩・レイヤー',library:'保存'})){let b=document.createElement('button');b.textContent=name;b.dataset.tab=id;b.onclick=()=>{tab=id;for(let k of ['blend','color','light','library'])$(k).classList.toggle('hidden',k!==id);document.querySelectorAll('nav button').forEach(x=>x.classList.toggle('active',x===b));render()};$('nav').append(b)}$('nav').firstChild.classList.add('active');for(let k of ['base','ink']){$(k).oninput=()=>{$(k+'Hex').value=$(k).value;render()};$(k+'Hex').oninput=()=>{let v=$(k+'Hex').value;if(/^#?[0-9a-f]{6}$/i.test(v)){$(k).value='#'+v.replace('#','');render()}}}$('op').oninput=render;$('shape').onchange=render;$('space').onchange=render;$('applyChannels').onclick=()=>{let a=$('channels').value.split(/[,\s]+/).map(Number);if(a.length!==3||a.some(x=>!Number.isFinite(x)))return status('3つの数値を入力してください');let h=hex($('space').value==='RGB'?a.map(x=>x/255):fromHSV(...a));$('ink').value=h;$('inkHex').value=h;render()};$('all').onclick=()=>{allowed=Object.keys(modes);filters();render()};$('upload').onchange=()=>{let f=$('upload').files[0];if(!f)return;let u=URL.createObjectURL(f),im=new Image();im.onload=()=>{let c=document.createElement("canvas");let scale=Math.min(1,1024/Math.max(im.width,im.height));c.width=Math.max(1,Math.round(im.width*scale));c.height=Math.max(1,Math.round(im.height*scale));c.getContext("2d").drawImage(im,0,0,c.width,c.height);image=c;URL.revokeObjectURL(u);render();status("画像を読み込みました")};im.onerror=()=>{URL.revokeObjectURL(u);status('画像を読み込めませんでした')};im.src=u};$('clear').onclick=()=>{image=null;$('upload').value='';render()};$('add').onclick=()=>{layers.unshift({color:$('ink').value,mode:allowed[0]||'通常',op:+$('op').value,shape:'glow',size:70});layerUI();render()};$('example').onclick=example;$('stackCanvas').onclick=e=>sample($('stackCanvas'),e);$('savePNG').onclick=()=>download($('stackCanvas').toDataURL(),'BlendLab.png');$('savePreset').onclick=()=>{presets.push({name:$('presetName').value||'Preset '+(presets.length+1),state:state()});persist()};$('export').onclick=()=>{let u=URL.createObjectURL(new Blob([JSON.stringify({state:state(),presets},null,2)],{type:'application/json'}));download(u,'BlendLab.json');setTimeout(()=>URL.revokeObjectURL(u),1000)};$('import').onchange=async()=>{try{let o=JSON.parse(await $('import').files[0].text());restore(o.state);status('設定を読み込みました（保存ボタンでプリセット登録できます）')}catch(e){status('読み込み失敗: '+e.message)}};filters();example();presetUI();render();$("boot").textContent="起動完了 — 合成モードを操作できます";</script></html>
